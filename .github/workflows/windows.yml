name: Windows Build

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always
  CC_x86_64_pc_windows_gnu: x86_64-w64-mingw32-gcc.exe
  AR_x86_64_pc_windows_gnu: x86_64-w64-mingw32-gcc-ar.exe
  CARGO_TARGET_X86_64_PC_WINDOWS_GNU_LINKER: x86_64-w64-mingw32-gcc.exe

jobs:
  build-windows:
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v4

      # Install the UCRT64 C toolchain and htslib's C dependencies via MSYS2
      - name: Set up MSYS2 with UCRT64 dependencies
        id: msys2
        uses: msys2/setup-msys2@v2
        with:
          msystem: UCRT64
          update: true
          install: >-
            mingw-w64-ucrt-x86_64-cmake
            mingw-w64-ucrt-x86_64-gcc
            mingw-w64-ucrt-x86_64-clang
            mingw-w64-ucrt-x86_64-zlib
            mingw-w64-ucrt-x86_64-bzip2
            mingw-w64-ucrt-x86_64-xz
            mingw-w64-ucrt-x86_64-pkg-config
            mingw-w64-ucrt-x86_64-libsystre

      - name: Configure MSYS2 paths
        shell: pwsh
        run: |
          $msys2Root = "${{ steps.msys2.outputs.msys2-location }}"
          $ucrtPrefix = Join-Path $msys2Root "ucrt64"
          $ucrtPrefixUnix = $ucrtPrefix.Replace("\", "/")

          "$msys2Root\usr\bin" | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append
          "$ucrtPrefix\bin" | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append
          "PKG_CONFIG_PATH=$ucrtPrefix\lib\pkgconfig" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          "LIBCLANG_PATH=$ucrtPrefix\bin" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          "CFLAGS_x86_64_pc_windows_gnu=-I$ucrtPrefixUnix/include" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

      - name: Verify MSYS2 toolchain
        shell: pwsh
        run: |
          where.exe x86_64-w64-mingw32-gcc.exe
          x86_64-w64-mingw32-gcc.exe -v
          if (-not (Test-Path "$env:LIBCLANG_PATH\..\include\regex.h")) {
            throw "regex.h was not found in the UCRT64 include directory"
          }

      # Install the pinned Rust toolchain with the Windows GNU target
      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: "1.90.0"
          targets: x86_64-pc-windows-gnu
          components: rustfmt

      - name: Cache cargo registry
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-

      - name: Build
        shell: pwsh
        env:
          PKG_CONFIG_ALLOW_CROSS: "1"
          # Force static linking of C deps so the .exe has no UCRT64 DLL runtime dependency
          LIBZ_SYS_STATIC: "1"
          BZIP2_SYS_STATIC: "1"
          LZMA_SYS_STATIC: "1"
        run: cargo build --release --target x86_64-pc-windows-gnu

      - name: Test
        shell: pwsh
        env:
          PKG_CONFIG_ALLOW_CROSS: "1"
          LIBZ_SYS_STATIC: "1"
          BZIP2_SYS_STATIC: "1"
          LZMA_SYS_STATIC: "1"
        run: cargo test --target x86_64-pc-windows-gnu

      - name: Upload modkit.exe
        uses: actions/upload-artifact@v4
        with:
          name: modkit-windows-x86_64
          path: target/x86_64-pc-windows-gnu/release/modkit.exe
